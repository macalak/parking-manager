plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.14.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.gsonfire:gson-fire:1.8.5'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.30'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

}

def generatedOpenApiDir = layout.buildDirectory.dir('generated/openapi')
def generatedContractOpenApiDir = layout.buildDirectory.dir('generated/contract-openapi')

openApiGenerate {
    generatorName = 'spring'
    skipValidateSpec = true
    inputSpec = "$rootDir/apispec/openapi.yaml"
    outputDir = generatedOpenApiDir.get().asFile.absolutePath
    modelPackage = 'com.example.parkingmanager.adapter.out.parkingapi.generated.model'
    apiPackage = 'com.example.parkingmanager.adapter.out.parkingapi.generated.api'
    invokerPackage = 'com.example.parkingmanager.adapter.out.parkingapi.generated'
    globalProperties = [
        apis             : 'false',
        models           : '',
        supportingFiles  : 'false',
        modelDocs        : 'false',
        modelTests       : 'false'
    ]
    configOptions = [
        dateLibrary            : 'java8',
        useSpringBoot3          : 'true',
        openApiNullable        : 'false',
        hideGenerationTimestamp: 'true'
    ]
}

tasks.register('openApiGenerateContract', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = 'java'
    library = 'okhttp-gson'
    skipValidateSpec = true
    inputSpec = file("$rootDir/apispec/cc-openapi.yaml").toURI().toString()
    outputDir = generatedContractOpenApiDir.get().asFile.absolutePath
    modelPackage = 'com.example.parkingmanager.adapter.out.parkingcontract.generated.model'
    apiPackage = 'com.example.parkingmanager.adapter.out.parkingcontract.generated.api'
    invokerPackage = 'com.example.parkingmanager.adapter.out.parkingcontract.generated'
    globalProperties = [
        apis            : '',
        models          : '',
        supportingFiles : 'ApiClient.java,ApiException.java,ApiResponse.java,ApiCallback.java,Configuration.java,JSON.java,Pair.java,ProgressRequestBody.java,ProgressResponseBody.java,ServerConfiguration.java,ServerVariable.java,StringUtil.java,Authentication.java,HttpBasicAuth.java,HttpBearerAuth.java,ApiKeyAuth.java,OAuth.java',
        modelDocs       : 'false',
        modelTests      : 'false',
        apiTests        : 'false',
        apiDocs         : 'false'
    ]
    configOptions = [
        dateLibrary            : 'java8',
        useJakartaEe            : 'true',
        hideGenerationTimestamp: 'true',
        serializationLibrary   : 'jackson'
    ]
}

sourceSets {
    main {
        java {
            srcDir generatedOpenApiDir.map { it.dir('src/main/java') }
            srcDir generatedContractOpenApiDir.map { it.dir('src/main/java') }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
    dependsOn tasks.named('openApiGenerateContract')
}

tasks.named('test') {
    useJUnitPlatform()
}
