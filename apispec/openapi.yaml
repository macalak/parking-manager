            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterValueDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/counter'
  '/v1/{tenantName}/counters/{idCounter}':
    put:
      tags:
        - CounterController
      summary: New counter values
      description: >-
        Update counter values.   Required permissions:    -
        `capacity-management_update` 
      operationId: externalUpdateCounterById_1
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: idCounter
          in: path
          description: Id of counter to be updated
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterValueDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/counter'
      deprecated: true
  '/v2/{tenantName}/counters/aggregate':
    post:
      tags:
        - CounterControllerV2
      summary: Get counters of a partner admin by tenant name and criteria filter
      description: >-
        Get counters by search criteria: tenant name, counter types, facilities,
        products, product groups, product types.<br/><br/>Required
        permissions:<br/><br/>  - `product-counting-ui_read` 
      operationId: externalGetCustomerCountersByFilter
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterFilterDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountersPageDto'
  '/v1/{tenantName}/counters/aggregate':
    post:
      tags:
        - CounterController
      summary: Get counters of a partner admin by tenant name and criteria filter
      description: >-
        Get counters by search criteria: tenant name, counter types, facilities,
        products, product groups, product types.   Required permissions:    -
        `product-counting-ui_read` 
      operationId: externalGetCustomerCountersByFilter_1
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterFilterDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountersPageDto'
      deprecated: true
  '/v2/{tenant}/occupancy/standardcounters':
    get:
      tags:
        - SB eConnect
      summary: All standard counters
      description: Returns all standard counters for all parking facilities.
      operationId: publicGetStandardCounters
      parameters:
        - name: tenant
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: >-
                  #/components/schemas/PublicGetStandardCounters200ResponseEconnectDto
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PublicGetStandardCounters200ResponseEconnectDto
            text/plain:
              schema:
                $ref: >-
                  #/components/schemas/PublicGetStandardCounters200ResponseEconnectDto
        '400, 403, 404, 500':
          description: Error
          content:
            application/xml:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
  '/v2/{tenant}/occupancy/standardcounters/{locationid}':
