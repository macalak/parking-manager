                  #/components/schemas/PublicGetStandardCountersByLocationId200ResponseEconnectDto
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PublicGetStandardCountersByLocationId200ResponseEconnectDto
            text/plain:
