          content:
            application/xml:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
  '/v2/{tenantName}/places':
    get:
      tags:
        - APDS
      summary: List and search for elements in the Place hierarchy
      description: >-
        Lists `Places` and allows searching/filtering by:  * `latitude`,
        `longitude`, `radius` * `modified_since` * `layer` * `type` *
        `right_type` * `structure_type` * `structure_grade` * `name` <br/>
        Required permissions:<br/> - `apds_read`<br/>
      operationId: publicGetPlaces
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description: >-
            The number of items to skip before starting to return results (for
            pagination).
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            nullable: true
        - name: pageSize
          in: query
          description: The maximum number of items to return per page.
          required: false
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            nullable: true
        - name: referenceInstant
          in: query
          description: >-
            Allows a consistent view of data across multiple paged requests. 
            Unix epoch time to be used as reference for offset > 0  (corresponds
            to query instant, as returned by server on first call) -  should be
            the same for all pages.
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            nullable: true
        - name: latitude
          in: query
          description: >-
            Location latitude to use as filter (mandatory if longitude or radius
            are defined)
          required: false
          schema:
            type: number
            format: float
            nullable: true
        - name: longitude
          in: query
          description: >-
            Location longitude to use as filter (mandatory if longitude or
            radius are defined)
          required: false
          schema:
            type: number
            format: float
            nullable: true
        - name: radius
          in: query
          description: Number of metres to use as search filter
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            nullable: true
        - name: expand
          in: query
          description: Optional attributes to expand
          required: false
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: layer
          in: query
          description: Most detailed layer of data desired.
          required: false
          schema:
            type: integer
            format: int32
            nullable: true
        - name: type
          in: query
          description: Comma-separated list of Place types
          required: false
          schema:
            type: array
            nullable: true
            items:
              type: string
              enum:
                - campus
                - identifiedArea
                - parkingPlace
                - space
                - subplaceElement
        - name: right_type
          in: query
          description: Comma-separated list of RightSpecifications types
          required: false
          schema:
            type: array
            nullable: true
            items:
              type: string
              enum:
                - accessPermission
                - loadingUnloading
                - oneTimeUseParking
                - permitParking
                - setdownPickup
                - waiting
        - name: structure_type
          in: query
          description: Comma-separated list of Structure types
          required: false
          schema:
            type: array
            nullable: true
            items:
              type: string
              enum:
                - offStreetStructure
                - offStreetSurface
                - onStreet
        - name: structure_grade
          in: query
          description: Comma-separated list of Structure grades
          required: false
          schema:
            type: array
            nullable: true
            items:
              type: string
              enum:
                - aboveGround
                - groundLevel
                - underground
        - name: name
          in: query
          description: Name of place hierarchy element
          required: false
          schema:
            type: string
            nullable: true
        - name: modified_since
          in: query
          description: Show resources changed after given timestamp (epoch seconds).
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGetPlaces200ResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    status: error
                    code: 400
                    message: >-
                      getPlaces.referenceInstant: must be greater than or equal
                      to 0
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    status: error
                    code: 403
                    message: ACCESS_DENIED
        '501':
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                NotImplementedExample:
                  description: NotImplementedExample
                  value:
                    status: error
                    code: 501
                    message: FILTERING_NOT_YET_IMPLEMENTED
  '/v2/{tenantName}/counters':
    get:
      tags:
        - CounterControllerV2
      summary: List counters
      description: >-
        Get counters by search criteria: tenant name, facilities. <br/><br/>
        Required permissions: <br/><br/> - `capacity-management_read` 
      operationId: externalGetCounters
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
            description: Tenant Name
            example: schwalmstrasse
        - name: facilities
          in: query
          description: 'Facilities uuid seperated by '','''
          required: false
          schema:
            type: string
            description: 'Facilities uuid seperated by '','''
            nullable: true
            example: >-
              de458726-e29d-4d98-893c-5c036721eb16,77849e65-2db1-40f4-a185-32626d63809d
      responses:
        '200':
          description: List of counters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/counter'
        '404':
          description: No counters found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/counter'
  '/v2/{tenantName}/booking-counters/occupancy-schedule':
    get:
      tags:
        - BookingCounterV2
      summary: >-
        Deprecated endpoint for retrieving the occupancy of booked parking
        places by period
      description: >-
        This endpoint is deprecated and will be removed on 2025-12-26. Use GET
        /customers-contracts/v2/tenantName/bookings/occupancy-schedule instead.
      operationId: externalGetBookingCounterOccupencySchedule
      parameters:
        - name: correlationId
          in: header
          description: Mandatory correlation ID in order to track the request
          required: true
          schema:
            type: string
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: startDateTime
          in: query
          description: Start date and time of of the query (in UTC format)
          required: true
          schema:
            type: string
            description: Start date and time of of the query (in UTC format)
            format: date-time
            example: '2023-08-20T09:00:00Z'
        - name: endDateTime
          in: query
          description: End date and time of of the query (in UTC format)
          required: true
          schema:
            type: string
            description: End date and time of of the query (in UTC format)
            format: date-time
            example: '2023-08-21T09:00:00Z'
        - name: productNumber
          in: query
          description: Product business id
          required: true
