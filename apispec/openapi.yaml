    Times:
      required:
        - available24hours
        - openAllYear
        - openingTimesNotSpecified
        - openingTimesUnknown
      type: object
      properties:
        available24hours:
          type: boolean
          description: >-
            If [TRUE], the identified parking hierarchy entities is available 24
