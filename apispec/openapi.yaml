components:
  schemas:
    CommandResponseEconnectDto:
      type: object
      properties:
        status:
          type: integer
          description: >-
            The response code for the request <br/> 0: request successful <br/>
            other values: request failed
          format: int32
          nullable: true
    ResponseStatus:
      required:
        - status
      type: object
      properties:
        status:
          type: string
          description: Type of status
          enum:
            - ok
            - error
        code:
          type: integer
          description: Same numbering and semantics as HTTP status codes
          format: int32
          nullable: true
        message:
          type: string
          description: >-
            Descriptive message for error statuses or a error status with the
            following possible values <br/> -
            INVALID_OCCUPANCY_GREATER_THAN_PHYSICAL_COUNTER_CAPACITY: Count can
            not exceed physical capacity of the given location.<br/> -
            INVALID_OCCUPANCY_LESS_THEN_SPECIFIC_COUNTERS_SUM: Count can not be
            less then the sum of specific facility's counters.<br/> 
          nullable: true
      description: 'Codifies responses following some creation, update or delete operation'
    AccessAndEgressDto:
