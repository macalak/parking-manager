      required:
        - className
        - deleteTimestamp
        - id
      type: object
      properties:
        id:
          type: string
        className:
          pattern: '^([A-Z][a-z0-9]+)+'
          type: string
        deleteTimestamp:
          type: string
          description: The instant when the reference was deleted
          format: date-time
      description: >-
        A reference to a deleted identifiable managed object where the
        identifier is unique. It is described by a string identifying the class
        of the referenced object (key name) with a unique string identifier as
        its value, and the deletion instant.
    PaginatedListMetaMetaDto:
      required:
        - offset
        - pageSize
        - referenceInstant
        - total
      type: object
      properties:
        referenceInstant:
          minimum: 0
          type: integer
          description: >-
            Allows a consistent view of data across multiple paged requests.
            Unix epoch time to be used as reference for offset > 0 (corresponds
            to query instant, as returned by server on first call) - should be
            the same for all pages
          format: int32
        offset:
          minimum: 0
          type: integer
          description: Index of the first item returned in the page
          format: int32
        pageSize:
          minimum: 0
          type: integer
          description: Maximum number of items that can be returned per page
          format: int32
        total:
          minimum: 0
          type: integer
          description: Total number of items contained in all pages
          format: int32
