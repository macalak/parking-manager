openapi: 3.0.1
info:
  title: Capacity management REST API
  description: |-
    <center>
            <strong>
              CONFIDENTIAL  
              © 2024 Scheidt & Bachmann Parking Solutions GmbH, Germany 
            </strong>
          </center>
servers:
  - url: 'https://pm.preprod.parking.scheidt-bachmann.net/capacity-manager'
    description: Apisix
  - url: 'https://pm.preprod.parking.scheidt-bachmann.net/capacity-manager'
    description: Kong
tags:
  - name: BookingCounter
    description: >-
      Booking counters are used to count reservations of parking spaces on
      specified dates. These reservations can be made by a consumer who has a
      valid flexible product.
  - name: CounterControllerV2
    description: >-
      Counter API is dedicated for operations on counters. A counter reflects
      the calculated number of physical or virtual occupied and available
      places: physical by facility/area, virtual by category of use (reserved,
      pre-booked, non-reserved)
  - name: BookingCounterV2
    description: >-
      Booking counters are used to count reservations of parking spaces on
      specified dates. These reservations can be made by a consumer who has a
      valid flexible product.
  - name: APDS
    description: Alliance for Parking Data Standards
  - name: SB eConnect
    description: the SB eConnect API
  - name: CounterController
    description: >-
      Counter API is dedicated for operations on counters. A counter reflects
      the calculated number of physical or virtual occupied and available
      places: physical by facility/area, virtual by category of use (reserved,
      pre-booked, non-reserved)
paths:
  '/v2/{tenant}/occupancy/counter/{locationid}/{counterid}':
    put:
      tags:
        - SB eConnect
      summary: Change standard counter
      description: >-
        Manipulates the values of the selected standard counter using query
        parameters.<br/>Exactly one of the query parameters (occupiedstate,
        maxplaces, increasefreeplaces, decreasefreeplaces) is required and
        allowed.
      operationId: publicUpdateCounter
      parameters:
        - name: tenant
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: locationid
          in: path
          description: The location id of the parking facility
          required: true
          schema:
            type: string
        - name: counterid
          in: path
          description: 'The id of the counter to manipulate. Allowed values are: 0, 1, 2'
          required: true
          schema:
            type: integer
            format: int32
        - name: occupiedstate
          in: query
          description: >-
            Set the standard counter to fully occupied (occupiedstate  = 1 ).
            It's not possible to set the standard counter to free
            (occupiedstate  = 0 ) if it's already occupied.
          required: false
          schema:
            type: integer
            format: int32
            nullable: true
        - name: maxplaces
          in: query
          description: >-
            set the number of maximum places for a standard counter, which is
            used to recalculate the free places. available = maxplaces -
            occupied.
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            nullable: true
        - name: increasefreeplaces
          in: query
          description: increase the amount of free places by this value
          required: false
          schema:
            type: integer
            format: int32
            nullable: true
        - name: decreasefreeplaces
          in: query
          description: reduce the amount of free places by this value
          required: false
          schema:
            type: integer
            format: int32
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CommandResponseEconnectDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponseEconnectDto'
            text/plain:
              schema:
                $ref: '#/components/schemas/CommandResponseEconnectDto'
        '400, 403, 404, 500':
          description: Error
          content:
            application/xml:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
  '/v2/{tenantName}/places/{id}':
    get:
      tags:
        - APDS
      summary: Read an element in the Place hierarchy
      description: >-
        Get latest version of a given place hierarchy element by its identifier
        (or a particular previous version when provided as a query parameter).
        <br/> Required permissions:<br/> - `apds_read`<br/>
      operationId: publicGetPlacesId
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier for place hierarchy element
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Previous version number.
          required: false
          schema:
            minimum: 1
            type: integer
            format: int32
            nullable: true
        - name: expand
          in: query
          description: Optional attributes to expand
          required: false
          schema:
            type: array
            nullable: true
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    status: error
                    code: 400
                    message: 'getPlacesId.version: must be greater than or equal to 1'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    status: error
                    code: 403
                    message: ACCESS_DENIED
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                NotFoundExample:
                  description: NotFoundExample
                  value:
                    status: error
                    code: 404
                    message: PLACE_NOT_FOUND
        '501':
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                NotImplementedExample:
                  description: NotImplementedExample
                  value:
                    status: error
                    code: 501
                    message: FILTERING_NOT_YET_IMPLEMENTED
    put:
      tags:
        - APDS
      summary: Update Place hierarchy element
      description: >-
        Update an element in the `Place` hierarchy (or one of its associated
        attributes like `Occupancy`) <br/> Required permissions:<br/> -
        `apds_update`<br/>
      operationId: publicPutPlacesId
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Unique identifier for place hierarchy element
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Place'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    status: error
                    code: 400
                    message: ''
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    status: error
                    code: 403
                    message: ACCESS_DENIED
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                NotFoundExample:
                  description: NotFoundExample
                  value:
                    status: error
                    code: 404
                    message: NO_COUNTERS_FOR_FACILITY
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
              examples:
                InternalServerErrorExample:
                  description: InternalServerErrorExample
                  value:
                    status: error
                    code: 500
                    message: NO_PHYSICAL_COUNTER_ASSOCIATED_TO_FACILITY
