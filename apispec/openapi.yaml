    contingent:
      type: object
      properties:
        id:
          type: string
          description: A generated and unique uuid
          format: uuid
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
        value:
          type: integer
          description: Counter capacity for the current day
          format: int32
          nullable: true
          example: 100
        dayOfWeek:
          type: string
          description: Day of week
          nullable: true
          example: TUESDAY
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
      description: Allocated maximum number of places for the counter by day
    counter:
      type: object
      properties:
        id:
          type: string
          description: A generated and unique uuid related to each counter
          format: uuid
          nullable: true
          example: b859657f-42f8-4ac2-aed1-19da1169565d
        businessId:
          type: string
          description: >-
            Counter business generated automatically when creating a counter, it
            is unique by counter.         **The below table defines the counter
            business id  structure**  | Object           |
            Format                    | A                             |
            B                             |               i                    
            | example                            | | ---------------- |
            ---------------------     | ------------                 
            |-----------                    |
            ----------------------------------- |
            ---------------------------------- | | Physical counter |
            ABnnnnnnnnn               |P &nbsp;&nbsp;&nbsp;&nbsp;|H  
            &nbsp;&nbsp;&nbsp;&nbsp;        |               
            -                    | PHFC9763070                        |
            |                  |                          
            |                               |                              
            |                                     |
            &nbsp;                        | | Standard counter |
            ABnnnnnnnnniiiiiiiii&nbsp;|S &nbsp;&nbsp;&nbsp;&nbsp;     |T 
            &nbsp;&nbsp;&nbsp;&nbsp;    |RESERVED,  &nbsp;                    |
            STFC9763070RESERVED                | |                 
            |                           |                              
            |                               |NON_RESERVED
            &nbsp;                  | STFC9763070NON_RESERVED             |
            |                  |                          
            |                               |                              
            |PREBOOKED &nbsp;                     | STFC9763070PREBOOKED      
            |  
          nullable: true
          example: STFC9878338RESERVED
        category:
          type: string
          description: 'Counter category: [RESERVED,NON_RESERVED,PREBOOKED..] '
          nullable: true
          example: RESERVED
        available:
          type: integer
          description: Number of regulated available places ( cannot be a negative value )
          format: int32
          nullable: true
          example: 80
        occupied:
          type: integer
          description: Number of regulated occupied places ( cannot be a negative value )
          format: int32
          nullable: true
          example: 20
        real_available:
          type: integer
          description: Number of effective available places ( can be a negative value )
          format: int32
          nullable: true
          example: 80
          deprecated: true
        real_occupied:
          type: integer
          description: Number of effective occupied places ( can be a negative value )
          format: int32
          nullable: true
          example: 20
          deprecated: true
        capacity:
          type: integer
          description: Counter total capacity
          format: int32
          nullable: true
          example: 100
        threshold:
          type: integer
          description: >-
            Threshold of available places to consider the counter as full
            (currently not used)
          format: int32
          nullable: true
          example: 1
        full:
          type: boolean
          description: 'Status of the counter: full/free'
          nullable: true
          example: false
        validityDate:
          type: string
          description: Counter validity date (currently not used)
          format: date-time
          nullable: true
          example: '2024-05-08T13:00:00Z'
        contingents:
          type: array
          items:
            $ref: '#/components/schemas/contingent'
        locationId:
          type: string
          description: Facility location  id
          nullable: true
          example: SB.12365.2363.3658.11235
        facilityId:
          type: string
          description: Facility id
          nullable: true
          example: b868123a-53f8-4ac2-aed1-19da1169565d
        facilityName:
          type: string
          description: Facility name
          nullable: true
          example: Facility 1234
        counterType:
          type: string
          description: Counter type
          nullable: true
          example: SPECIFIC
          enum:
            - PHYSICAL
            - SPECIFIC
            - USAGE
            - DEFAULT
            - AGGREGATION
        counterMode:
          type: string
          description: >-
            Operational counter mode impacting the transaction
            management         **The below table defines the transaction
            management action in relation between counter state and counter
            mode  | Counter State    | Mode (Override)           |
            Action                        | | ---------------- |
            ---------------------     | ------------                  | |
            free             | normal                    |transaction manager to
            allow parking| | free             | ignored                  
            |transaction manager to allow parking| | free             |
            blocked                   |transaction manager to disable parking  
            | | occupied         | normal                    |transaction
            manager to disable parking | | occupied         |
            ignored                   |transaction manager to allow parking | |
            occupied         | blocked                   |transaction manager to
            disable parking|  
          nullable: true
          example: NORMAL
          enum:
            - NORMAL
            - IGNORED
            - BLOCKED
        percentage:
          type: number
          description: Calculated value = percentage of occupancy/capacity
          format: float
          nullable: true
          example: 20
        product:
          $ref: '#/components/schemas/product'
      description: >-
        Details of the product access profile, the days and time when the
        product can be used
