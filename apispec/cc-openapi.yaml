            type: string
          title: Set
          uniqueItems: true
        contractBusinessIdList:
          type: array
          example:
            - A20250602
            - A20250603
          items:
            type: string
          title: Set
          uniqueItems: true
        consumer:
          $ref: '#/components/schemas/ConsumerSearchCriteriaAndConsumerDto'
        presenceProductBusinessIds:
          type: array
          description: >-
            Used to perform an exact match search on product business id list
