openapi: 3.1.0
info:
  title: Customers Contracts Consumers REST API
  description: |
    <center>
        <strong>
         CONFIDENTIAL <br/>
         © 2026 Scheidt & Bachmann Parking Solutions GmbH, Germany
        </strong>
    </center>
  version: '2.0'
servers:
  - url: 'https://pm.preprod.parking.scheidt-bachmann.net/customers-contracts'
    description: Apisix
  - url: 'https://pm.preprod.parking.scheidt-bachmann.net/customers-contracts'
    description: Kong
security:
  - bearerAuth: []
tags:
  - name: RegularConsumer
    description: >-
      RegularConsumer API - The regular consumer is a consumer that can access
      parking spaces of a car-park with his vehicle on a regular basis.
  - name: ProductUpgrade
    description: >-
      Product Upgrade API - ProductUpgrade is a product which is upgraded to
      another product sharing the same facilities.
  - name: Registration
    description: Self-registration operations
  - name: VisitorConsumer
    description: >-
      VisitorConsumer API is dedicated for operations on consumers of type
      Visitor. VisitorConsumer is a temporary consumer, who can access the
      parking during the visit period only.
  - name: Customer
    description: >-
      Customer API is dedicated for operations on customers. The customer is the
      legal entity that enters into a contract with the contractual partner for
      a parking service in the car park and is also financially responsible for
      the service. The customer can be a private person or a company. Different
      products can be offered to private customers and companies. A customer can
      have different contracts. One or more consumers can be assigned to a
      customer.
  - name: Consumer
    description: >-
      Consumer API is dedicated for common operations on both types of
      consumers; Regular (i.e.  employees, residents..) and Visitor. The
      consumer is the person who enters/exits the parking, and can use multiple
      vehicules so can have multiple license plates. The consumer is defined for
      one customer. A customer can have many consumers. A consumer can be
      assigned to one or many contracts to benefit from parking services. The
      operations of creation, update, delete of consumers must be done with
      endpoints of RegularConsumer or VisitorConsumer.
  - name: BusinessPartners
    description: BusinessPartner API is dedicated for operations on Business Partner.
  - name: Contract
    description: >-
      Contract API is dedicated for operations on contracts. A contract is
      established between the customer and the car-park operator, by which the
      consumers of a customer can benefit from specified parking services.
  - name: PreBooking
    description: >-
      Pre-Booking API - Manage creation, update, deletion, cancellation and
      retrieval of pre-bookings.
  - name: FlexibleBooking
    description: >-
      Flexible Booking API - Flexible booking is a reservation made by a
      consumer who has a flexible product to have a parking space on specified
      dates.
  - name: Operator
    description: >-
      Operator API - A car park operator is the entity responsible for managing
      a car park.
  - name: Invitation
    description: Operations about invitations
  - name: Consumer Pass
    description: the Consumer Pass API
paths:
  '/v2/{tenantName}/pre-bookings/{reservationId}':
    get:
      tags:
        - PreBooking
      summary: Get a pre-booking by id
      operationId: publicGetPreBookingById
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
            maxLength: 255
            minLength: 1
        - name: reservationId
          in: path
          description: Pre-booking identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pre-booking found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
    put:
      tags:
        - PreBooking
      summary: Update a pre-booking
      operationId: publicUpdatePreBooking
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
            maxLength: 255
            minLength: 1
        - name: reservationId
          in: path
          description: >-
            Pre-booking identifier. Accepts either the **internal reservation
            ID** (`ReservationId`) or the **external/foreign reservation ID**
            (`ForeignReservationId`). The system will resolve the pre-booking by
            checking both values.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInterfaceUpdateRequestDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/ReservationInterfaceUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Pre-booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReservationInterfaceResponseDto'
    delete:
      tags:
        - PreBooking
      summary: Delete a pre-booking
      operationId: publicDeletePreBooking
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
            maxLength: 255
            minLength: 1
        - name: reservationId
          in: path
          description: >-
            Pre-booking identifier. Accepts either the **internal reservation
            ID** (`ReservationId`) or the **external/foreign reservation ID**
            (`ForeignReservationId`). The system will resolve the pre-booking by
            checking both values.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Bad request
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Internal server error
