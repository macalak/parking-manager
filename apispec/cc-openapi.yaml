  '/v2/{tenantName}/customers/{customerId}/consumers/regular/aggregates/{businessId}':
    put:
      tags:
        - RegularConsumer
      summary: Update a regular consumer
      description: >-
        Update an existing regular consumer for an existent customer. Regular
        consumer may be associated to specific contract products
      operationId: publicUpdateConsumer
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
            maxLength: 255
            minLength: 1
        - name: businessId
          in: path
          description: >-
            Consumer generated business id. Format is= Nyyyynnnnnnnn (yyyy =
            year of creation, nnnnnnnn = random ID (8)).
          required: true
          schema:
            type: string
        - name: customerId
          in: path
          description: >-
            Customer generated business id. Format is= CXyyyynnnnnn (X = C
            "company"; P "private"; B "B2C" , yyyy = year of creation, nnnnnnnn
            = random ID (6)).
          required: true
          schema:
            type: string
        - name: sendInvitation
          in: query
          description: Send invitation after the update of consumer.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerRegularContractUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerRegularContractDto'
        '400':
          description: BAD REQUEST
          content:
