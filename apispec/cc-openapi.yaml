            capacity available for the requested booking.<br/>   -
            COUNTER_NOT_FOUND: Capacity counter was not found.<br/>   -
            INVALID_BOOKING_NUMBER_SPACES: The number of spaces requested is
            invalid.<br/>   - INVALID_BOOKING_IN_PAST: Booking date cannot be in
            the past.<br/>   - INVALID_BOOKING_START_NOT_EQUAL_END: Start and
            end times must be equal for this type of booking.<br/>   -
            INVALID_BOOKING_START_AFTER_RECURRENCE_END: Booking start date is
            after the recurrence end date.<br/>   -
            INVALID_BOOKING_PRODUCT_CATEGORY: The product category is not valid
            for booking.<br/>   -
            INVALID_BOOKING_WITH_CONTRACT_PRODUCT_CONTINGENT: Booking not
            allowed due to contract product contingent constraints.<br/>   -
            INVALID_BOOKING_WITH_CONTRACT_START_DATE: Booking occurs before the
            contract start date.<br/>   -
            INVALID_BOOKING_WITH_CONTRACT_END_DATE: Booking occurs after the
            contract end date.<br/>   -
            INVALID_BOOKING_WITH_PRODUCT_PREBOOKING_AHEAD: Booking exceeds the
            product’s prebooking time frame.<br/>   -
            INVALID_BOOKING_WITH_PRODUCT_GROUP_MAX_LOOK_AHEAD: Booking exceeds
            the maximum look-ahead limit of the product group.<br/>   -
            INVALID_BOOKING_WITH_PRODUCT_ACCESS_PROFILE: Customer does not have
            required access profile for the product.<br/>   -
            INVALID_BOOKING_OVERLAP: Booking overlaps with an existing
