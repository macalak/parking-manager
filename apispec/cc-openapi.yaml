          items:
            type: string
          title: Set
          uniqueItems: true
        customerName:
          type: string
          description: Used to perform a case-insensitive partial search on customer name.
          example: Peter
          maxLength: 255
          minLength: 3
        productBusinessIdList:
          type: array
          description: >-
            Used to perform an exact match search on product business id list
