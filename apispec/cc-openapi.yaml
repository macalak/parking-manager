  '/v2/{tenantName}/contracts/{businessId}':
    get:
      tags:
        - Contract
      summary: 'Get contract '
      description: Get a contract details by business id
      operationId: publicGetContract
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
            maxLength: 255
            minLength: 1
        - name: businessId
          in: path
          description: >-
            Contract generated business id. Format is= Ayyyynnnnnnnn (yyyy =
            year of creation, nnnnnnnn = random ID (8)).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDetailsV2Dto'
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorSchemasDto'
              examples:
                NotFoundExample:
                  description: NotFoundExample
                  value:
                    timestamp: '2025-04-24T08:30:00Z'
                    code: DATA_NOT_FOUND
                    message: Contract with business id A2025Xv15nHLD5 not found
                    subErrors: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorSchemasDto'
              examples:
                ServerErrorExample:
                  description: ServerErrorExample
                  value:
                    timestamp: '2025-04-24T09:25:00Z'
                    code: INTERNAL_SERVER_ERROR
                    message: Database connection failed
                    subErrors: []
    put:
      tags:
        - Contract
      summary: Update contract
      description: >-
        <p>Update an existing contract. The validations at the update of a
        contract are:</p>  <ul>    <li>startTime is mandatory</li>   
        <li>startTime is less than or equal to endTime</li>    <li>      product
        validations      <ul>        <li>productStatus is ACTIVE</li>       
        <li>the list of facilities of the product belongs to the operator of the
        contract</li>      </ul>    </li>  </ul>
      operationId: publicUpdateContract
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
            maxLength: 255
            minLength: 1
        - name: businessId
          in: path
          description: >-
            Contract generated business id. Format is= Ayyyynnnnnnnn (yyyy =
            year of creation, nnnnnnnn = random ID (8)).
          required: true
          schema:
            type: string
      requestBody:
