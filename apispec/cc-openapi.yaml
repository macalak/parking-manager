          description: >-
            Start date and time of the booking (ISO 8601 with timezone). For a
            whole-day booking, set this equal to `endDateTime`.
          example: '2023-05-25T12:30Z'
        endDateTime:
          type: string
          format: date-time
          description: >-
            End date and time of the booking (ISO 8601 with timezone). For a
            whole-day booking, set this equal to `startDateTime`. For an
            intra-day booking, this must be after `startDateTime`, on the same
            calendar day, and at least 1 hour later.
          example: '2023-05-25T12:30Z'
        recurrence:
          $ref: '#/components/schemas/BookingRecurrenceDto'
