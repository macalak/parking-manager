    FlexibleBookingCreationRequest:
      type: object
      description: >-
        Request body for creating a flexible booking.  Two booking modes are
        supported based on the relationship between `startDateTime` and
        `endDateTime`: - **Whole-day**: when `startDateTime` equals
        `endDateTime`, the booking covers the entire day.   An all-day access
        profile must be configured for the product on the requested day of the
        week. - **Intra-day**: when `endDateTime` is after `startDateTime`, the
        booking covers the specified time range.   Start and end must be on the
        same calendar day, with a minimum duration of 1 hour.
      properties:
        startDateTime:
          type: string
          format: date-time
          description: >-
            Start date and time of the booking (ISO 8601 with timezone). For a
            whole-day booking, set this equal to `endDateTime`.
          example: '2023-05-25T12:30Z'
        endDateTime:
          type: string
          format: date-time
          description: >-
            End date and time of the booking (ISO 8601 with timezone). For a
            whole-day booking, set this equal to `startDateTime`. For an
            intra-day booking, this must be after `startDateTime`, on the same
            calendar day, and at least 1 hour later.
          example: '2023-05-25T12:30Z'
        recurrence:
          $ref: '#/components/schemas/BookingRecurrenceDto'
        consumerBusinessId:
          type: string
          description: consumer business id
          example: N2023pxOCMHxY
        contractBusinessId:
          type: string
          description: contract business id
          example: A202212345678
        productBusinessId:
          type: string
          description: contract business id
          example: P2022FC4B4h
        facilityBusinessId:
          type: string
          description: facility business id
          example: F2003325D897
      required:
        - consumerBusinessId
        - contractBusinessId
        - endDateTime
        - facilityBusinessId
        - productBusinessId
        - startDateTime
      title: FlexibleBookingCreationRequestDto
