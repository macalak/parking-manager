            facilities were associated with the visit.<br/>   -
            VISIT_TYPE_SWITCH_NOT_FOUND: Requested visit type switch could not
            be found.<br/>   - INVALID_VISIT_START_AFTER_END: Visit start time
            is after the end time.<br/>   - INVALID_VISIT_PRODUCT_CATEGORY: The
            product category is not valid for the visit.<br/>   -
            INVALID_VISIT_PRODUCT_CATEGORY_CHANGE: Change of product category is
            not allowed.<br/>   - INVALID_VISIT_IN_PAST: The visit date is in
            the past.<br/>   - INVALID_VISIT_LICENCE_PLATE: The license plate is
            invalid or improperly formatted.<br/>   - MIN_LENGTH_NOT_REACHED:
            The provided value does not meet the minimum length
            requirement.<br/>   - MAX_LENGTH_EXCEEDED: The provided value
            exceeds the maximum allowed length.<br/>   - LPN_PATTERN_VIOLATION:
            The license plate number does not match the required pattern.<br/>  
            - INVALID_VISIT_WITH_CONTRACT_START_DATE: Visit starts before the
            contract's start date.<br/>   -
            INVALID_VISIT_WITH_CONTRACT_END_DATE: Visit ends after the
            contract's end date.<br/>   -
            INVALID_VISIT_WITH_PRODUCT_PREBOOKING_AHEAD: Visit exceeds the
            prebooking window defined by the product.<br/>   -
            INVALID_BOOKING_WITH_PRODUCT_MINIMAL_BOOKING_PERIOD: Booking
            duration is shorter than the product's minimum allowed
            period.<br/>   - INVALID_VISIT_WITH_PRODUCT_GROUP_MAX_LOOK_AHEAD:
            Visit is too far in the future, beyond the product group's maximum
            look-ahead.<br/>   - INVALID_VISIT_WITH_PRODUCT_ACCESS_PROFILE: The
            customer does not have the required access profile for this
            product.<br/>   - INVALID_VISIT_EXTENSION_NOT_CONFIRMED: Visit
            extension is not confirmed.
