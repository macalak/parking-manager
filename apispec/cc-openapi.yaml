          example: '2022-01-30T08:30Z'
        message:
          type: string
          description: error message returned from backend
          example: data not found
        subErrors:
          type: array
          items:
            $ref: '#/components/schemas/SubErrorDto'
          title: List
        code:
          type: string
          description: >-
            Possible error codes:<br/>   - DATA_NOT_FOUND: Data was not
            found.<br/>   - CONSUMER_NOT_FOUND: Consumer was not found.<br/>   -
            UPGRADE_FROM_PRODUCT_NOT_FOUND: Upgrade source product not
            found.<br/>   - UPGRADE_TO_PRODUCT_NOT_FOUND: Upgrade target product
            not found.<br/>
      title: ProductUpgradeNotFoundApiErrorDto
    ProductUpgradeApiErrorDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: date and time of error
          example: '2022-01-30T08:30Z'
        message:
          type: string
          description: error message returned from backend
          example: data not found
        code:
          $ref: '#/components/schemas/ProductUpgradeBadRequestErrorCodeDto'
        subErrors:
          type: array
          items:
            $ref: '#/components/schemas/ProductUpgradeApiSubErrorDto'
          title: List
      title: ProductUpgradeApiErrorDto
    ProductUpgradeApiSubErrorDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: date and time of error
          example: '2025-04-24T08:30Z'
        message:
          type: string
          description: error message returned from backend
          example: This field is required
        field:
          type: string
          description: field contains the error
          example: field
        code:
          type: string
          description: >-
            Error codes for invalid upgrade scenarios:<br/>   -
            INVALID_UPGRADE_VALID_UNTIL: The 'valid until' date is not
            acceptable.<br/>   - INVALID_UPGRADE_BEFORE_CONTRACT: Upgrade
            attempted before contract start.<br/>   -
            INVALID_UPGRADE_AFTER_CONTRACT: Upgrade attempted after contract
            end.<br/>   - INVALID_UPGRADE_PRODUCT_EXISTS_IN_SUB_CONTRACT:
            Product already exists in sub-contract.<br/>   -
            INVALID_UPGRADE_PRODUCTS_FACILITIES: Incompatible facilities between
            products.<br/>   - INVALID_UPGRADE_OLD_PRODUCT_UPGRADED: Old product
            has already been upgraded.<br/>   -
            INVALID_UPGRADE_VALID_FROM_BEFORE_LAST_UPGRADE: 'Valid from' date
            precedes the last upgrade.<br/>   - INVALID_UPGRADE_TO_SAME_PRODUCT:
            Attempted upgrade to the same product, which is not allowed.<br/>  
            - MUST_NOT_BE_NULL: Field must not be null
      title: ProductUpgradeApiSubErrorDto
    ProductUpgradeBadRequestErrorCodeDto:
      type: object
