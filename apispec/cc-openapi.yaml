    visit_extension:
      type: object
      description: Visit extension information
      properties:
        visitExtensionStart:
          type: string
          format: date-time
          description: >-
            Start date and time of the MULTI USE visit in ISO 8601 format (e.g.,
            "2025-04-20T14:30:00Z"). - The offset/zone is IGNORED (e.g. "Z",
            "+05:30") - Server applies timezone based on facilities' timezone -
            Example: "2025-04-20T14:30:00+05:30" will be treated as 14:30:00 in
            facilities timezone
          example: '2025-01-10T08:30Z'
        visitExtensionEnd:
          type: string
          format: date-time
          description: >-
            End date and time of the MULTI USE visit in ISO 8601 format (e.g.,
            "2025-04-20T14:30:00Z"). - The offset/zone is IGNORED (e.g. "Z",
            "+05:30") - Server applies timezone based on facilities' timezone -
            Example: "2025-04-20T14:30:00+05:30" will be treated as 14:30:00 in
            facilities timezone
          example: '2025-01-10T11:30Z'
        revision:
          type: integer
          format: int32
          description: Current version of the visit.
          example: 3
      required:
        - revision
        - visitExtensionEnd
        - visitExtensionStart
      title: VisitExtensionDto
    VisitExtensionApiErrorDto:
      type: object
      properties:
        timestamp:
          type: string
          description: date and time of error
          example: '30-01-2022 08:30:00'
        message:
          type: string
          description: error message returned from backend
          example: data not found
        code:
          type: string
          description: >-
            Error code indicating the type of issue. Possible values:   -
            ILLEGAL_ARGUMENT: An illegal or unsupported argument was provided.
        subErrors:
          type: array
          items:
            $ref: '#/components/schemas/VisitExtensionApiSubErrorDto'
          title: List
      title: VisitExtensionApiErrorDto
    VisitExtensionApiSubErrorDto:
      type: object
      properties:
        timestamp:
          type: string
          description: date and time of error
          example: '24-04-2025 08:30:00'
        message:
          type: string
          description: error message returned from backend
          example: This field is required
        field:
          type: string
          description: field contains the error
          example: field
        code:
          type: string
          description: >-
            Error code indicating the reason why a visit or booking request is
            invalid.<br/> Possible values:<br/>   - INVALID_FACILITIES_EMPTY: No
            facilities were associated with the visit.<br/>   -
            INVALID_VISIT_START_AFTER_END: Visit start time is after the end
            time.<br/>   - INVALID_VISIT_IN_PAST: The visit date is in the
            past.<br/>   - INVALID_ONGOING_VISIT_START_TIME: The visit start
            time cannot be changed.<br/>   - INVALID_ONGOING_VISIT_END_TIME:
            Visit end time should be in the future.<br/>   -
            INVALID_VISIT_PRODUCT_CATEGORY: The product category is not valid
            for the visit.<br/>   - INVALID_VISIT_WITH_CONTRACT_START_DATE:
            Visit starts before the contract's start date.<br/>   -
            INVALID_VISIT_WITH_CONTRACT_END_DATE: Visit ends after the
            contract's end date.<br/>   -
            INVALID_VISIT_WITH_PRODUCT_PREBOOKING_AHEAD: Visit exceeds the
            prebooking window defined by the product.<br/>   -
            INVALID_VISIT_WITH_PRODUCT_GROUP_MAX_LOOK_AHEAD: Visit is too far in
            the future, beyond the product group's maximum look-ahead.<br/>   -
            INVALID_VISIT_WITH_PRODUCT_ACCESS_PROFILE: The customer does not
            have the required access profile for this product.<br/>   -
            INVALID_BOOKING_WITH_PRODUCT_MINIMAL_BOOKING_PERIOD: Booking
            duration is shorter than the product's minimum allowed
            period.<br/>   - INVALID_EXPIRED_VISIT: Visit in the past can't be
            changed.<br/>   - INVALID_VISIT_STATUS: The visit extension is
            applicable only to visits with the status BOOKED.<br/>
      title: VisitExtensionApiSubErrorDto
