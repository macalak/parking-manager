        availability expressed as a percentage (0–100) based on bookable slots
        during a day.  The calculation is performed for the specified contract,
        product, customer, and consumer.
      operationId: publicGetBookingsCapacityStatus
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: Start date of the query in ISO format (yyyy-MM-dd).
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date of the query in ISO format (yyyy-MM-dd).
          required: true
          schema:
            type: string
            format: date
        - name: contractBusinessId
          in: query
          description: Contract generated business id. Format is= Ayyyynnnnnnnn.
          required: true
          schema:
            type: string
        - name: productBusinessId
          in: query
          description: Product business id
          required: true
          schema:
            type: string
        - name: consumerBusinessId
          in: query
          description: Consumer generated business id. Format is= Nyyyynnnnnn.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingCapacityStatusDto'
        '400':
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleBookingCounterApiErrorDto'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    timestamp: '2025-04-24T08:30:00Z'
                    code: ILLEGAL_ARGUMENT
                    message: Invalid booking parameters
                    subErrors:
                      - field: startDate
                        message: Start date is after end date
                        code: INVALID_START_DATE_AFTER_END_DATE
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleBookingCounterApiErrorDto'
              examples:
                NotFoundExample:
                  description: NotFoundExample
                  value:
                    timestamp: '2025-04-24T08:30:00Z'
                    code: PRODUCT_NOT_FOUND
                    message: Product not found
                    subErrors: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorSchemasDto'
              examples:
                ServerErrorExample:
                  description: ServerErrorExample
                  value:
                    timestamp: '2025-04-24T09:25:00Z'
                    code: INTERNAL_SERVER_ERROR
                    message: Database connection failed
                    subErrors: []
  '/v2/{tenantName}/bookings/available-slots':
    get:
      tags:
        - FlexibleBooking
      summary: >-
        Retrieve available flexible booking slots for a given date and duration
        type
      description: >-
        Returns the list of available flexible booking time slots within the
        specified date-time range.  The response includes all available slots
        for the given contract, product, customer, and consumer context on the
        specified booking date.  Each slot contains: - The start and end
        date-time of the available interval. - The number of parking spots
        available for booking.
      operationId: publicGetBookingsAvailableSlots
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi-tenant system
          required: true
          schema:
            type: string
        - name: contractBusinessId
          in: query
          description: Contract generated business id. Format is= Ayyyynnnnnnnn.
          required: true
          schema:
            type: string
        - name: productBusinessId
          in: query
          description: Product business id
          required: true
          schema:
            type: string
        - name: consumerBusinessId
          in: query
          description: Consumer generated business id. Format is= Nyyyynnnnnn.
          required: true
          schema:
            type: string
        - name: bookingDate
          in: query
          description: Date of the booking in ISO format (yyyy-MM-dd).
          required: true
          schema:
            type: string
            format: date
        - name: durationType
          in: query
          description: Type of booking duration.
          required: true
          schema:
            type: string
            enum:
              - TWO_HOURS
              - FOUR_HOURS
              - ALL_DAY
            title: BookingDurationDto
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAvailableSlotListDto'
        '400':
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleBookingCounterApiErrorDto'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    timestamp: '2025-04-24T08:30:00Z'
                    code: ILLEGAL_ARGUMENT
                    message: Invalid booking parameters
                    subErrors:
                      - field: bookingDate
                        message: bookingDate must not be null
                        code: MUST_NOT_BE_NULL
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleBookingCounterApiErrorDto'
              examples:
                NotFoundExample:
                  description: NotFoundExample
                  value:
                    timestamp: '2025-04-24T08:30:00Z'
                    code: PRODUCT_NOT_FOUND
                    message: Product not found
                    subErrors: []
        '500':
