        facilityBusinessId:
          type: string
          description: facility business id
          example: F2003325D897
        id:
          type: string
          format: uuid
          readOnly: true
        timezone:
          type: string
          description: Facility timezone
          example: Europe/Berlin
          readOnly: true
        bookedDays:
          type: array
          description: List of booked days
          example:
            - '2023-05-25'
          items:
            type: string
            format: date
          readOnly: true
          title: Set
          uniqueItems: true
        revision:
          type: integer
          format: int32
          description: Version of data
          example: 3
      required:
