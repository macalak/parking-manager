        Creates a flexible booking for a consumer.  The API supports two booking
        modes determined by the relationship between `startDateTime` and
        `endDateTime`:  - **Whole-day booking** (`startDateTime ==
        endDateTime`): The booking covers the entire calendar day.   The access
        profile associated with the product must allow all-day access on the
        requested day of the week. - **Intra-day booking** (`endDateTime >
        startDateTime`): The booking covers a specific time range within a
        single day.   Both `startDateTime` and `endDateTime` must fall on the
        same calendar day, and the duration must be at least 1 hour.   The time
        range must be fully included in one of the product's access profile
        recurrence windows.  Invalid requests (e.g. `endDateTime <
        startDateTime`, cross-day intra-day range, duration under 1 hour, or
        access profile mismatch) are rejected with a `400` response containing a
        specific error code and message.
      operationId: publicCreateFlexibleBooking
      parameters:
        - name: tenantName
          in: path
          description: Unique name of tenant in multi tenant system
          required: true
          schema:
            type: string
            maxLength: 255
            minLength: 1
        - name: X-Action-Origin
          in: header
          description: >-
            Indicates the origin or source that triggered this API call. Example
            values: `transaction-manager`.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlexibleBookingCreationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleBookingDto'
        '400':
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleBookingApiErrorDto'
              examples:
                BadRequestExample:
                  description: BadRequestExample
                  value:
                    timestamp: '2025-04-24T08:30:00Z'
                    code: ILLEGAL_ARGUMENT
                    message: Invalid booking
                    subErrors:
                      - field: startDateTime
                        message: >-
                          Booking overlapping not allowed for the same consumer,
                          product, facility and datetime
                        code: INVALID_BOOKING_OVERLAP
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlexibleBookingNotFoundApiErrorDto'
              examples:
                NotFoundExample:
                  description: NotFoundExample
                  value:
                    timestamp: '2025-04-24T08:30:00Z'
                    code: CONSUMER_NOT_FOUND
                    message: Consumer not found
                    subErrors: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorSchemasDto'
              examples:
                ServerErrorExample:
                  description: ServerErrorExample
                  value:
                    timestamp: '2025-04-24T09:25:00Z'
                    code: INTERNAL_SERVER_ERROR
                    message: Database connection failed
                    subErrors: []
