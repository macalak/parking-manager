    ConsumerSearchCriteriaAndConsumerDto:
      type: object
      properties:
        consumerBusinessIds:
          type: array
          description: Used to perform an exact match search on consumer business id list.
          example:
            - C2023FC100
            - C2023HD200
          items:
            type: string
          title: Set
          uniqueItems: true
        consumerTypeList:
          type: array
          description: >-
            Used to perform an exact match search on consumer type. Accepted
            values are VISITOR and REGULAR. If no types are provided, the search
            will generate the intersection of criteria results, avoiding
            separate filtering for each type. When querying for both Regular and
            Visitor, the results will include both regular consumers and
            visitors. Each type can be further refined based on specific
            criteria, visitors by the criteria specified in the visitor object
            and regular consumers by the criteria outlined in the regular
            consumer object.
          example:
            - REGULAR
            - VISITOR
          items:
            type: string
          title: Set
          uniqueItems: true
        consumerName:
          type: string
          description: Used to perform a case-insensitive partial search on consumer name.
          example: Peter
        consumerLpn:
          type: string
          description: Used to perform a case-insensitive partial search on license plate.
          example: AB123456
          maxLength: 20
          minLength: 3
        consumerLpnExactMatch:
          type: string
          description: >-
            Used to perform a case-insensitive exact match search on the license
            plate.
          example: AB123456
          maxLength: 20
          minLength: 3
        consumerEmail:
          type: string
          description: Used to perform a case-insensitive partial search on email.
          example: consumer@mail.com
        presenceStatus:
          type: boolean
          description: Used to perform an exact match search on consumer presence
        regular:
          $ref: '#/components/schemas/ConsumerSearchCriteriaAndConsumerRegularDto'
        visitor:
          $ref: '#/components/schemas/ConsumerSearchCriteriaAndConsumerVisitorDto'
      title: ConsumerSearchCriteriaAndConsumerDto
    ConsumerSearchCriteriaAndConsumerRegularDto:
      type: object
      properties:
        consumerInvitationStatusList:
          type: array
          description: >-
            Used to perform an exact match search on the status of consumer
            invitation to B2C portal. Accepted values are TO_BE_INVITED,
            INVITED, ON_BOARDED and INVALID.
          example:
            - INVITED
            - TO_BE_INVITED
          items:
            type: string
          title: Set
          uniqueItems: true
        externalReference:
          type: string
          description: >-
            External reference in external system used especially when user's
            imported
          example: C2024-U223F
        costCenter:
          type: string
          description: Book keeping (ERP) reference to a booking account
          example: C2024-U223F
      title: ConsumerSearchCriteriaAndConsumerRegularDto
    ConsumerSearchCriteriaAndConsumerVisitorDto:
